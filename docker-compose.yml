services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinica-sertao-portal
    container_name: clinica-sertao-portal
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
    restart: unless-stopped
    networks:
      - clinica-network

networks:
  clinica-network:
    external: true
