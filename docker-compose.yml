version: "3.8"

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinica-sertao-portal
    container_name: clinica-sertao-portal
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - API_URL=http://clinica-sertao-api:8080
    restart: unless-stopped
    networks:
      - clinica-network

networks:
  clinica-network:
    external: true
